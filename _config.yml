# Site Build Settings

# jekyll-paginate configuration
paginate:            5

# Build settings
markdown:            kramdown
highlighter:         rouge
permalink:           /:title
plugins:             [jekyll-paginate, jekyll-sitemap, jekyll-feed, jekyll-seo-tag]
# plugins:             [jekyll-paginate, jekyll-sitemap]

# Customise atom feed settings (this is where Jekyll-Feed gets configuration information)
title:		           "My Mad Inventing Projects"
description:	       "A random selection of works"
author:              "Jeremy Gold"
github.url:          "https://jeremygold.github.io"

hide_post_share:   true
hide_related_posts: true
